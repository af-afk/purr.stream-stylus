[package]
name = "stylus-hello-world"
version = "0.1.11"
edition = "2021"
license = "MIT"
homepage = "https://github.com/af-afk/purr.stream-stylus"
repository = "https://purr.stream"
keywords = ["arbitrum", "ethereum", "stylus", "alloy"]
description = "Purr Stream (Rust Stylus edition)"

[dependencies]
alloy-primitives = { version = "=0.8.20", default-features = false, features = ["native-keccak"] }
alloy-sol-types = "=0.8.20"
mini-alloc = "0.8.4"
stylus-sdk = "0.8.4"

[dev-dependencies]
tokio = { version = "1.12.0", features = ["full"] }
ethers = "2.0"
stylus-sdk = { version = "0.8.4", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]

[[bin]]
name = "stylus-hello-world"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"

# If you need to reduce the binary size, it is advisable to try other
# optimization levels, such as "s" and "z"
opt-level = 3
